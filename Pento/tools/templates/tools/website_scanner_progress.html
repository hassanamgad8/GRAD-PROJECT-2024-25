<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Scanner Progress</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        #progress-bar {
            width: 100%;
            background-color: #ddd;
        }
        #progress-bar-fill {
            width: 0%;
            height: 30px;
            background-color: #4caf50;
            text-align: center;
            line-height: 30px;
            color: white;
        }
        .terminal {
            background-color: black;
            color: #00ff00;
            font-family: monospace;
            padding: 20px;
            margin-top: 20px;
            height: 300px;
            overflow-y: scroll;
        }
    </style>
</head>
<body>
    <h1>Website Scanner Progress</h1>
    <div id="progress-bar">
        <div id="progress-bar-fill">0%</div>
    </div>
    <p>Status: <span id="status">{{ report.status }}</span></p>
    <p>Target: {{ report.target }}</p>
    <div class="terminal" id="terminal-output">Initializing scan...</div>
    <script>
        const terminalOutput = document.getElementById("terminal-output");
        const progressBarFill = document.getElementById("progress-bar-fill");
        const statusElement = document.getElementById("status");
    
        function fetchProgress() {
    fetch(`/website-scanner/progress/api/{{ scan_id }}/`)
        .then((response) => response.json())
        .then((data) => {
            const progressBarFill = document.getElementById("progress-bar-fill");
            const terminalOutput = document.getElementById("terminal-output");

            // Update progress bar
            progressBarFill.style.width = `${data.progress}%`;
            progressBarFill.textContent = `${data.progress}%`;

            // Update terminal output
            if (data.terminal_output) {
                terminalOutput.textContent = data.terminal_output;
                terminalOutput.scrollTop = terminalOutput.scrollHeight;
            }

            // Handle completed or failed status
            if (data.status === "completed" || data.status === "failed") {
                clearInterval(progressInterval);
            }
        })
        .catch((error) => console.error("Error fetching progress:", error));
}

const progressInterval = setInterval(fetchProgress, 2000);
fetchProgress();
    </script>
    <script>
        const scanId = "{{ scan_id }}";  // Pass the scan_id to JavaScript
    </script>
    <script src="{% static 'js/website_scanner.js' %}"></script>
</body>
</html>
